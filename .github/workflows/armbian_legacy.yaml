name: Build Armbian Legacy (4.19) with H.264 Encoding for Orange Pi Zero

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          # 可添加其他发行版，如 jammy, focal

jobs:
  build:
    name: Build Legacy Image
    runs-on: ubuntu-22.04   # 仍使用官方支持的宿主机版本，但实际构建在容器内进行
    steps:
      - name: Checkout Code (optional)
        uses: actions/checkout@v4
        # 注意：Armbian 构建脚本会自动从官方仓库拉取源码，此步仅为保存一些自定义补丁（如果你有）

      - name: Build Armbian Image in Docker
        run: |
          # 创建输出目录（用于挂载，以便获取产物）
          mkdir -p ./output

          # 运行 Armbian 官方 Docker 镜像，执行编译命令
          docker run --rm \
            -v $(pwd)/output:/output \
            -e BOARD=orangepizero \
            -e BRANCH=legacy \
            -e RELEASE=${{ github.event.inputs.release }} \
            -e BUILD_MINIMAL=no \
            -e BUILD_DESKTOP=no \
            -e KERNEL_CONFIGURE=no \
            -e COMPRESS_OUTPUTIMAGE=sha,xz \
            -e IGNORE_UPDATES=yes \
            -e EXPERT=yes \
            armbian/build:latest \
            ./compile.sh \
              BOARD=orangepizero \
              BRANCH=legacy \
              RELEASE=${{ github.event.inputs.release }} \
              BUILD_MINIMAL=no \
              BUILD_DESKTOP=no \
              KERNEL_CONFIGURE=no \
              COMPRESS_OUTPUTIMAGE=sha,xz \
              IGNORE_UPDATES=yes \
              EXPERT=yes \
              OUTPUTDIR=/output

      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-legacy
          path: output/*.xz          # 因为输出目录挂载到 /output，产物直接在这里
          retention-days: 7
          if-no-files-found: error
