name: Build Armbian Legacy (4.19) with H.264 Encoding for Orange Pi Zero

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm

jobs:
  build:
    name: Build Legacy Image
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-legacy-DynamicIP
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support \
            gcc-arm-linux-gnueabihf u-boot-tools device-tree-compiler \
            libncurses-dev libssl-dev expect

      - name: Disable Docker to Force Native Build
        run: |
          sudo systemctl stop docker.service docker.socket || true
          sudo systemctl disable docker.service docker.socket || true
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io || true
          sudo apt-get autoremove -y

      # ========== 关键：使用旧版 Armbian 构建框架 (v23.02) ==========
      - name: Clone Armbian Build Framework (v23.02)
        run: |
          git clone https://github.com/armbian/build armbian-build
          cd armbian-build
          git checkout v23.02

      - name: Prepare aria2 cache directory
        run: |
          mkdir -p armbian-build/cache/.aria2
          touch armbian-build/cache/.aria2/server_stats

      - name: Create Armbian config file
        run: |
          cd armbian-build
          mkdir -p userpatches
          cat << EOF > userpatches/config-default.conf
          BOARD="orangepizero"
          BRANCH="legacy"
          RELEASE="${{ github.event.inputs.release }}"
          BUILD_DESKTOP="no"
          BUILD_MINIMAL="no"
          KERNEL_CONFIGURE="no"
          COMPRESS_OUTPUTIMAGE="sha,xz"
          IGNORE_UPDATES="yes"
          EXPERT="yes"
          EOF

      # ========== 核心修复：强制跳过内置工具链下载，使用系统工具链 ==========
      - name: Compile Armbian Image (legacy kernel)
        run: |
          cd armbian-build
          export DIALOG=disabled
          export TERM=dumb
          export USE_ARIA2=no
          # 关键环境变量：强制使用 GitHub Runner 自带的工具链，跳过 Armbian 内置下载
          export USE_GITHUB_RUNNER_TOOLCHAIN=yes
          export SKIP_TOOLCHAIN_DOWNLOAD=yes
          expect -c '
            log_user 1
            set timeout 7200
            spawn sudo -E ./compile.sh SHARE_LOG=yes
            expect {
              -re "Choose an option|Select|What would you like to do" {
                send "1\r"
                exp_continue
              }
              -re "Do you want to|Are you sure" {
                send "\r"
                exp_continue
              }
              timeout {
                send_user "Timeout waiting for prompt\n"
                exit 1
              }
              eof
            }
            wait
          ' 2>&1 | tee build.log

      - name: Check Armbian build logs
        run: |
          cd armbian-build
          echo "=== Armbian build logs (first 100 lines each) ==="
          if [ -d output/logs ]; then
            find output/logs -type f -name "*.log" -exec echo "--- {} ---" \; -exec head -100 {} \;
          else
            echo "No logs directory found"
          fi
          echo "=== End of logs ==="

      - name: List output directory for debugging
        run: |
          cd armbian-build
          echo "=== Contents of armbian-build/output/ ==="
          ls -la output/ || echo "Directory does not exist"
          echo "=== Contents of armbian-build/output/images/ ==="
          ls -la output/images/ || echo "Directory does not exist"
          echo "=== End of list ==="

      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: armbian-build/output/images/*.xz
          retention-days: 7
          if-no-files-found: error

  boot-test:
    name: QEMU Boot Test
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Install QEMU & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm xz-utils

      - name: Download Artifact Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./workspace

      - name: Extract Boot Files from Image
        run: |
          cd ./workspace
          echo "=> Uncompressing Image..."
          xz -d *.xz
          IMAGE_FILE=$(ls *.img | head -n 1)

          echo "=> Mounting image via loop device..."
          LOOP_DEV=$(sudo losetup -Pf --show "$IMAGE_FILE")

          sudo mkdir -p /mnt/armbian
          sudo mount "${LOOP_DEV}p1" /mnt/armbian

          echo "=> Copying kernel, initrd and DTB for QEMU..."
          mkdir -p ../boot-files

          KERNEL_SRC=$(ls /mnt/armbian/boot/{uImage,vmlinuz,zImage}* 2>/dev/null | head -n 1)
          cp "$KERNEL_SRC" ../boot-files/kernel

          INITRD_SRC=$(ls /mnt/armbian/boot/{uInitrd,initrd.img-*}* 2>/dev/null | head -n 1)
          cp "$INITRD_SRC" ../boot-files/initrd

          DTB_SRC=$(find /mnt/armbian/boot/ -name "sun8i-h2-plus-orangepi-zero.dtb" | head -n 1)
          cp "$DTB_SRC" ../boot-files/dtb

          echo "=> Cleaning up mounts..."
          sudo umount /mnt/armbian
          sudo losetup -d "$LOOP_DEV"
          mv "$IMAGE_FILE" ../armbian.img

      - name: Run QEMU Boot Assertion
        run: |
          echo "=> Starting QEMU emulation in background..."
          sudo qemu-system-arm \
            -M orangepi-zero \
            -m 1024 \
            -cpu cortex-a7 \
            -nographic \
            -dtb boot-files/dtb \
            -kernel boot-files/kernel \
            -initrd boot-files/initrd \
            -append 'earlyprintk loglevel=8 console=ttyS0 root=/dev/mmcblk0p1 rw rootwait' \
            -drive if=sd,format=raw,file=armbian.img > qemu_serial.log 2>&1 &

          QEMU_PID=$!
          TIMEOUT=240
          BOOT_SUCCESS=false
          echo "=> Waiting for system to reach login prompt (Timeout: ${TIMEOUT}s)..."

          for i in $(seq 1 $TIMEOUT); do
            if grep -E "login:|Reached target Multi-User System|Armbian" qemu_serial.log > /dev/null; then
              echo "✅ [SUCCESS] 镜像成功启动并进入控制台！"
              BOOT_SUCCESS=true
              break
            fi
            sleep 1
          done

          sudo kill $QEMU_PID || true

          echo "=================== QEMU 串口完整日志 ==================="
          cat qemu_serial.log
          echo "========================================================"

          if [ "$BOOT_SUCCESS" = false ]; then
            echo "❌ [FAILURE] 镜像未能成功引导或在超时时间内未到达登录界面。"
            exit 1
          fi
