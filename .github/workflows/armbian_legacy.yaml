name: Build Armbian Legacy (4.19) with H.264 Encoding for Orange Pi Zero

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          # 如有需要，可在此添加其他发行版，如 jammy, focal 等

jobs:
  build:
    name: Build Legacy Image
    runs-on: ubuntu-22.04          # ← 从 ubuntu-latest 改为 ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 核心步骤：使用官方的 Armbian 构建 Action
      - name: Build Armbian Image
        uses: armbian/build@main
        with:
          armbian_token: "${{ secrets.GITHUB_TOKEN }}"
          armbian_release: "${{ github.event.inputs.release }}"
          armbian_target: "build"          # "build" 表示构建完整镜像
          armbian_board: "orangepizero"
          # 关键参数：指定使用 legacy (4.19) 内核
          armbian_branch: "legacy"
          # 可选：自定义构建参数
          # armbian_extra: "BUILD_MINIMAL=no BUILD_DESKTOP=no KERNEL_CONFIGURE=no COMPRESS_OUTPUTIMAGE=sha,xz IGNORE_UPDATES=yes EXPERT=yes"

      # 上传编译好的镜像文件作为 Artifact
      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-legacy
          path: output/images/*.xz
          retention-days: 7
          if-no-files-found: error
