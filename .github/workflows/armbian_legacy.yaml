name: Build Armbian Legacy (4.19) with H.264 Encoding for Orange Pi Zero

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
          # 可添加其他发行版，如 jammy, focal

jobs:
  build:
    name: Build Legacy Image
    runs-on: ubuntu-22.04                # 官方支持的系统版本
    steps:
      - name: Checkout Armbian build scripts
        uses: actions/checkout@v4
        with:
          repository: armbian/build      # 直接从 armbian/build 仓库拉取
          ref: main                      # 使用主分支（也可改为稳定版 tag）
          path: armbian-build            # 存放到该目录

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binfmt-support bison build-essential ccache \
            debian-archive-keyring debootstrap device-tree-compiler \
            dosfstools flex gawk gcc-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu git gnupg gpg gpg-agent \
            libc6-dev-i386 libssl-dev libusb-1.0-0-dev linux-base \
            locales ncurses-dev parted pv qemu-user-static rsync \
            swig u-boot-tools uuid-dev zlib1g-dev

      - name: Build Armbian image
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=orangepizero \
            BRANCH=legacy \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            IGNORE_UPDATES=yes \
            EXPERT=yes

      - name: Upload output image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-legacy
          path: armbian-build/output/images/*.xz
          retention-days: 7
          if-no-files-found: error
