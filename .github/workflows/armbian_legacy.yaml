- name: Compile Armbian Image (legacy kernel)
  run: |
    cd armbian-build
    export DIALOG=disabled
    export TERM=dumb
    # 使用 expect 并开启详细日志
    expect -c '
      log_user 1
      set timeout 7200
      spawn sudo -E ./compile.sh SHARE_LOG=yes
      expect {
        -re "Choose an option|Select|What would you like to do" {
          send "1\r"
          exp_continue
        }
        -re "Do you want to|Are you sure" {
          send "\r"
          exp_continue
        }
        timeout {
          send_user "Timeout waiting for prompt\n"
          exit 1
        }
        eof
      }
      wait
    ' 2>&1 | tee build.log

- name: Check Armbian logs
  run: |
    cd armbian-build
    echo "=== Armbian build logs ==="
    if [ -d output/logs ]; then
      find output/logs -type f -name "*.log" -exec echo "--- {} ---" \; -exec head -100 {} \;
    else
      echo "No logs directory found"
    fi
    echo "=== End of logs ==="
