name: Build Armbian - Phase 1 (Driver + DTB)

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
      branch:
        description: '选择内核分支'
        required: true
        default: 'current'
        type: choice
        options:
          - current

jobs:
  build:
    name: Build Image (Driver + DTB)
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: Armbian-OPiZero-${{ github.event.inputs.release }}-${{ github.event.inputs.branch }}-cedar-ve
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install QEMU and Binfmt on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Disable Docker to Force Native Build
        run: |
          sudo systemctl stop docker.service docker.socket || true
          sudo systemctl disable docker.service docker.socket || true
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io || true
          sudo apt-get autoremove -y

      - name: Clone Armbian Build Framework
        run: git clone --depth=1 https://github.com/armbian/build armbian-build

      # ============================================================
      # 内核配置（CMA + ION）
      # ============================================================
      - name: Configure Kernel (CMA + ION)
        run: |
          mkdir -p armbian-build/userpatches/kernel/sunxi-${{ github.event.inputs.branch }}

          cat << 'EOF' > armbian-build/userpatches/kernel/sunxi-${{ github.event.inputs.branch }}/cedar-ve.cfg
          CONFIG_VIDEO_SUNXI_CEDRUS=m
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_V4L2_MEM2MEM_DEV=y
          CONFIG_CMA=y
          CONFIG_DMA_CMA=y
          CONFIG_CMA_SIZE_MBYTES=96
          CONFIG_CMA_SIZE_SEL_MBYTES=y
          CONFIG_CMA_AREAS=7
          CONFIG_ION=y
          CONFIG_ION_SYSTEM_HEAP=y
          CONFIG_ION_CMA_HEAP=y
          CONFIG_OF_OVERLAY=y
          CONFIG_OF_CONFIGFS=y
          EOF

          echo "✅ 内核配置补丁已创建"

      # ============================================================
      # 关键修改：customize-image.sh（使用 fdtput 修改 DTB）
      # ============================================================
      - name: Inject Customize Script (Driver + DTB via fdtput)
        run: |
          mkdir -p armbian-build/userpatches

          cat << 'CUSTOMIZE_EOF' > armbian-build/userpatches/customize-image.sh
          #!/bin/bash
          #
          # ============================================================
          # Armbian customize-image.sh - Phase 1: 底层驱动 + DTB
          # 目标：Orange Pi Zero (Allwinner H2+)
          # ============================================================
          #

          RELEASE=$1
          LINUXFAMILY=$2
          BOARD=$3
          BUILD_DESKTOP=$4

          if [[ "$BOARD" != "orangepizero" ]]; then
              exit 0
          fi

          echo "============================================================"
          echo " Phase 1: 底层驱动 + DTB"
          echo " Board: $BOARD | Family: $LINUXFAMILY | Release: $RELEASE"
          echo "============================================================"

          # ----------------------------------------------------------
          # 1. 安装依赖
          # ----------------------------------------------------------
          echo "[1/7] 安装依赖..."
          apt-get update
          apt-get install -y --no-install-recommends \
              build-essential \
              git \
              device-tree-compiler \
              bc \
              flex \
              bison \
              libssl-dev \
              ca-certificates \
              python3

          # 确认 fdtput 可用（device-tree-compiler 包含）
          if ! command -v fdtput &>/dev/null; then
              echo "  ⚠️ fdtput 不可用，尝试安装..."
              apt-get install -y device-tree-compiler
          fi
          echo "  fdtput: $(command -v fdtput 2>/dev/null || echo 'NOT FOUND')"
          echo "  dtc: $(command -v dtc 2>/dev/null || echo 'NOT FOUND')"

          # ----------------------------------------------------------
          # 2. 移除 cedrus 黑名单
          # ----------------------------------------------------------
          echo "[2/7] 移除 sunxi_cedrus 黑名单..."
          BLACKLIST_FILE="/etc/modprobe.d/blacklist-orangepizero.conf"
          if [ -f "$BLACKLIST_FILE" ]; then
              sed -i '/^blacklist sunxi_cedrus/s/^/# /' "$BLACKLIST_FILE"
          fi
          if ! grep -q "^cedrus" /etc/modules 2>/dev/null; then
              echo "cedrus" >> /etc/modules
          fi

          # ----------------------------------------------------------
          # 3. 编译安装 cedar_ve 驱动
          # ----------------------------------------------------------
          echo "[3/7] 编译 cedar_ve 驱动..."

          KERNEL_VERSION=$(ls /lib/modules/ | head -1)
          KERNEL_HEADERS_DIR="/usr/src/linux-headers-${KERNEL_VERSION}"

          if [ ! -d "$KERNEL_HEADERS_DIR" ]; then
              apt-get install -y linux-headers-${KERNEL_VERSION} 2>/dev/null || \
              apt-get install -y linux-headers-current-sunxi 2>/dev/null || true
          fi

          cd /tmp
          rm -rf sunxi-cedar-mainline
          git clone --depth=1 https://github.com/uboborov/sunxi-cedar-mainline.git || true

          CEDAR_BUILD_OK=false
          if [ -d "sunxi-cedar-mainline" ]; then
              cd sunxi-cedar-mainline
              if [ -d "$KERNEL_HEADERS_DIR" ]; then
                  make KERNEL_DIR="$KERNEL_HEADERS_DIR" 2>&1 && CEDAR_BUILD_OK=true
              fi
              if [ "$CEDAR_BUILD_OK" = false ]; then
                  make 2>&1 && CEDAR_BUILD_OK=true
              fi

              if [ "$CEDAR_BUILD_OK" = true ] && [ -f cedar_ve.ko ]; then
                  mkdir -p /lib/modules/${KERNEL_VERSION}/extra/
                  cp cedar_ve.ko /lib/modules/${KERNEL_VERSION}/extra/
                  depmod -a
                  echo "cedar_ve" > /etc/modules-load.d/cedar_ve.conf
                  echo "  ✅ cedar_ve.ko 安装成功"
              else
                  echo "  ⚠️ 编译失败，保留源码供首次启动编译"
                  mkdir -p /opt/cedar-ve-driver
                  cp -r /tmp/sunxi-cedar-mainline/* /opt/cedar-ve-driver/

                  cat > /opt/cedar-ve-driver/build.sh << 'BUILD_SCRIPT'
          #!/bin/bash
          LOG=/var/log/cedar-ve-build.log
          KVER=$(uname -r)
          KDIR="/usr/src/linux-headers-${KVER}"
          cd /opt/cedar-ve-driver
          if [ -d "$KDIR" ]; then
              make KERNEL_DIR="$KDIR" >> $LOG 2>&1
          else
              make >> $LOG 2>&1
          fi
          if [ -f cedar_ve.ko ]; then
              mkdir -p /lib/modules/${KVER}/extra/
              cp cedar_ve.ko /lib/modules/${KVER}/extra/
              depmod -a
              modprobe cedar_ve
              touch /opt/cedar-ve-driver/.built
          fi
          BUILD_SCRIPT
                  chmod +x /opt/cedar-ve-driver/build.sh

                  cat > /etc/systemd/system/cedar-ve-build.service << 'SVC'
          [Unit]
          Description=Build cedar_ve on first boot
          After=local-fs.target
          ConditionPathExists=!/opt/cedar-ve-driver/.built
          [Service]
          Type=oneshot
          ExecStart=/opt/cedar-ve-driver/build.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          SVC
                  systemctl enable cedar-ve-build.service
              fi
          fi

          # ----------------------------------------------------------
          # 4. 修改 DTB（使用 fdtput - 最可靠的方式）
          # ----------------------------------------------------------
          echo "[4/7] 修改 DTB..."

          # 查找 DTB 文件（尝试所有可能路径）
          DTB_FILE=""
          for candidate in \
              /boot/dtb/allwinner/sun8i-h2-plus-orangepi-zero.dtb \
              /boot/dtb/sun8i-h2-plus-orangepi-zero.dtb \
              /boot/sun8i-h2-plus-orangepi-zero.dtb \
              /boot/dtb-*/sun8i-h2-plus-orangepi-zero.dtb; do
              if [ -f "$candidate" ]; then
                  DTB_FILE="$candidate"
                  break
              fi
          done

          # 如果上面没找到，用 find 搜索
          if [ -z "$DTB_FILE" ]; then
              DTB_FILE=$(find /boot -name "sun8i-h2-plus-orangepi-zero.dtb" 2>/dev/null | head -1)
          fi

          # 再找不到，搜索任何 sun8i 的 dtb
          if [ -z "$DTB_FILE" ]; then
              DTB_FILE=$(find /boot -name "sun8i-h2-plus*.dtb" -o -name "sun8i-h3*.dtb" 2>/dev/null | head -1)
          fi

          if [ -n "$DTB_FILE" ] && [ -f "$DTB_FILE" ]; then
              echo "  => DTB 文件: $DTB_FILE"
              echo "  => 文件大小: $(stat -c%s "$DTB_FILE") bytes"

              # 备份
              cp "$DTB_FILE" "${DTB_FILE}.orig"

              # ──────────────────────────────────────────────────
              # 方法 A：使用 fdtput（直接修改 DTB 二进制，最可靠）
              # ──────────────────────────────────────────────────
              if command -v fdtput &>/dev/null; then
                  echo "  => 使用 fdtput 修改 DTB..."

                  # --- 4a. 添加 reserved-memory 节点 ---
                  # 创建 /reserved-memory 节点
                  fdtput -t s "$DTB_FILE" /reserved-memory "#address-cells" "1" 2>/dev/null || true
                  fdtput -t s "$DTB_FILE" /reserved-memory "#size-cells" "1" 2>/dev/null || true
                  fdtput -t s "$DTB_FILE" /reserved-memory "ranges" "" 2>/dev/null || true

                  # 创建 /reserved-memory/linux,cma 子节点
                  fdtput -t s "$DTB_FILE" /reserved-memory/linux,cma "compatible" "shared-dma-pool" 2>/dev/null || true
                  fdtput -t s "$DTB_FILE" /reserved-memory/linux,cma "reusable" "" 2>/dev/null || true
                  # size = 0x6000000 = 96MB
                  fdtput -t x "$DTB_FILE" /reserved-memory/linux,cma "size" "0x6000000" 2>/dev/null || true
                  # alignment = 0x400000 = 4MB
                  fdtput -t x "$DTB_FILE" /reserved-memory/linux,cma "alignment" "0x400000" 2>/dev/null || true
                  # 标记为默认 CMA 区域
                  fdtput -t s "$DTB_FILE" /reserved-memory/linux,cma "linux,cma-default" "" 2>/dev/null || true

                  echo "    ✅ reserved-memory/linux,cma 已添加"

                  # --- 4b. 添加 video-engine 节点 ---
                  VE_PATH="/soc/video-engine@1c0e000"

                  fdtput -t s "$DTB_FILE" "$VE_PATH" "compatible" "allwinner,sun8i-h2-plus-video-engine" 2>/dev/null || true
                  # reg = <0x01c0e000 0x1000>
                  fdtput -t x "$DTB_FILE" "$VE_PATH" "reg" "0x01c0e000 0x1000" 2>/dev/null || true
                  # clocks（使用 phandle 引用，这里用占位值）
                  # 实际 phandle 值需要从 DTB 中读取 ccu 的 phandle
                  # 先尝试获取 ccu 的 phandle
                  CCU_PHANDLE=$(fdtget -t x "$DTB_FILE" /soc/clock@1c20000 "phandle" 2>/dev/null || \
                                fdtget -t x "$DTB_FILE" /soc/clock-controller@1c20000 "phandle" 2>/dev/null || \
                                echo "")

                  if [ -n "$CCU_PHANDLE" ]; then
                      echo "    CCU phandle: $CCU_PHANDLE"
                      # clocks = <&ccu CLK_BUS_VE>, <&ccu CLK_VE>, <&ccu CLK_DRAM_VE>
                      # CLK_BUS_VE=0x44, CLK_VE=0x9d, CLK_DRAM_VE=0x72 (H2+/H3)
                      fdtput -t x "$DTB_FILE" "$VE_PATH" "clocks" \
                          "$CCU_PHANDLE 0x44 $CCU_PHANDLE 0x9d $CCU_PHANDLE 0x72" 2>/dev/null || true
                      fdtput -t s "$DTB_FILE" "$VE_PATH" "clock-names" "ahb" "mod" "ram" 2>/dev/null || true
                      # resets = <&ccu RST_BUS_VE>  RST_BUS_VE=0x14
                      fdtput -t x "$DTB_FILE" "$VE_PATH" "resets" "$CCU_PHANDLE 0x14" 2>/dev/null || true
                  else
                      echo "    ⚠️ 无法获取 CCU phandle，使用简化配置"
                      # 简化：不设置 clocks（驱动可能自行处理）
                  fi

                  # interrupts = <GIC_SPI 58 IRQ_TYPE_LEVEL_HIGH>
                  # = <0 58 4>
                  fdtput -t x "$DTB_FILE" "$VE_PATH" "interrupts" "0x00 0x3a 0x04" 2>/dev/null || true

                  # status = okay
                  fdtput -t s "$DTB_FILE" "$VE_PATH" "status" "okay" 2>/dev/null || true

                  echo "    ✅ video-engine@1c0e000 已添加"

                  # --- 4c. 禁用主线 cedrus 解码节点（避免冲突）---
                  CEDRUS_PATHS=(
                      "/soc/video-codec@1c0e000"
                      "/soc/cedrus@1c0e000"
                      "/soc/video-engine@1c0e000"
                  )
                  for cpath in "${CEDRUS_PATHS[@]}"; do
                      # 只禁用 "video-codec" 或 "cedrus"（不禁用我们刚添加的 video-engine）
                      if [[ "$cpath" == *"video-codec"* ]] || [[ "$cpath" == *"cedrus"* ]]; then
                          EXISTING_STATUS=$(fdtget "$DTB_FILE" "$cpath" "status" 2>/dev/null || echo "")
                          if [ -n "$EXISTING_STATUS" ]; then
                              fdtput -t s "$DTB_FILE" "$cpath" "status" "disabled" 2>/dev/null || true
                              echo "    ✅ 已禁用 $cpath (原 status=$EXISTING_STATUS)"
                          fi
                      fi
                  done

                  # --- 4d. 验证修改结果 ---
                  echo ""
                  echo "  => 验证 DTB 修改..."
                  VERIFY_OK=true

                  # 验证 reserved-memory
                  RM_COMPAT=$(fdtget "$DTB_FILE" /reserved-memory/linux,cma "compatible" 2>/dev/null || echo "")
                  if [ "$RM_COMPAT" = "shared-dma-pool" ]; then
                      echo "    ✅ /reserved-memory/linux,cma 存在且正确"
                  else
                      echo "    ❌ /reserved-memory/linux,cma 验证失败"
                      VERIFY_OK=false
                  fi

                  # 验证 video-engine
                  VE_STATUS=$(fdtget "$DTB_FILE" "$VE_PATH" "status" 2>/dev/null || echo "")
                  if [ "$VE_STATUS" = "okay" ]; then
                      echo "    ✅ $VE_PATH status=okay"
                  else
                      echo "    ❌ $VE_PATH 验证失败 (status=$VE_STATUS)"
                      VERIFY_OK=false
                  fi

                  VE_COMPAT=$(fdtget "$DTB_FILE" "$VE_PATH" "compatible" 2>/dev/null || echo "")
                  if [ -n "$VE_COMPAT" ]; then
                      echo "    ✅ $VE_PATH compatible=$VE_COMPAT"
                  else
                      echo "    ❌ $VE_PATH compatible 不存在"
                      VERIFY_OK=false
                  fi

                  if [ "$VERIFY_OK" = false ]; then
                      echo "  ⚠️ fdtput 修改验证失败，尝试方法 B..."
                      # 恢复备份，使用方法 B
                      cp "${DTB_FILE}.orig" "$DTB_FILE"
                      USE_METHOD_B=true
                  else
                      USE_METHOD_B=false
                  fi

              else
                  USE_METHOD_B=true
              fi

              # ──────────────────────────────────────────────────
              # 方法 B：dtc 反编译 → 修改 → 重编译（备用）
              # ──────────────────────────────────────────────────
              if [ "${USE_METHOD_B:-false}" = true ]; then
                  echo "  => 使用方法 B (dtc 反编译修改)..."

                  DTS_TMP="/tmp/opi-zero-modified.dts"
                  if dtc -I dtb -O dts -o "$DTS_TMP" "$DTB_FILE" 2>/dev/null; then

                      python3 << 'PY_DTS'
          import re

          dts_file = '/tmp/opi-zero-modified.dts'
          with open(dts_file, 'r') as f:
              dts = f.read()

          # 1. 添加 reserved-memory
          if 'reserved-memory' not in dts:
              cma_block = """
          \treserved-memory {
          \t\t#address-cells = <0x01>;
          \t\t#size-cells = <0x01>;
          \t\tranges;

          \t\tlinux,cma {
          \t\t\tcompatible = "shared-dma-pool";
          \t\t\treusable;
          \t\t\tsize = <0x6000000>;
          \t\t\talignment = <0x400000>;
          \t\t\tlinux,cma-default;
          \t\t};
          \t};
          """
              # 在根节点的第一个子节点前插入
              # 找到 "/ {" 或 "/dts-v1/;" 后的第一个节点
              root_match = re.search(r'(/\s*\{)', dts)
              if root_match:
                  insert_pos = root_match.end()
                  dts = dts[:insert_pos] + '\n' + cma_block + dts[insert_pos:]
                  print("    ✅ 已插入 reserved-memory")

          # 2. 添加 video-engine 节点到 soc 内部
          if 'video-engine@1c0e000' not in dts and 'video-engine@01c0e000' not in dts:
              ve_block = """
          \t\tvideo-engine@1c0e000 {
          \t\t\tcompatible = "allwinner,sun8i-h2-plus-video-engine";
          \t\t\treg = <0x01c0e000 0x1000>;
          \t\t\tinterrupts = <0x00 0x3a 0x04>;
          \t\t\tstatus = "okay";
          \t\t};
          """
              # 在 soc { 后面插入
              soc_match = re.search(r'soc\s*\{', dts)
              if soc_match:
                  insert_pos = soc_match.end()
                  dts = dts[:insert_pos] + '\n' + ve_block + dts[insert_pos:]
                  print("    ✅ 已插入 video-engine@1c0e000")

          # 3. 禁用主线 video-codec（如果存在）
          if 'video-codec@1c0e000' in dts:
              dts = re.sub(
                  r'(video-codec@1c0e000\s*\{[^}]*?)status\s*=\s*"okay"',
                  r'\1status = "disabled"',
                  dts, flags=re.DOTALL
              )
              print("    ✅ 已禁用 video-codec@1c0e000")

          with open(dts_file, 'w') as f:
              f.write(dts)
          PY_DTS

                      # 重编译 DTB
                      if dtc -I dts -O dtb -o "$DTB_FILE" "$DTS_TMP" 2>/dev/null; then
                          echo "    ✅ DTB 重编译成功"
                      else
                          echo "    ❌ DTB 重编译失败，恢复原始文件"
                          cp "${DTB_FILE}.orig" "$DTB_FILE"
                      fi
                      rm -f "$DTS_TMP"
                  else
                      echo "    ❌ DTB 反编译失败"
                  fi
              fi

              # --- 最终验证 ---
              echo ""
              echo "  => 最终 DTB 验证..."
              FINAL_DTS="/tmp/final-check.dts"
              if dtc -I dtb -O dts -o "$FINAL_DTS" "$DTB_FILE" 2>/dev/null; then
                  if grep -q "reserved-memory" "$FINAL_DTS"; then
                      echo "    ✅ reserved-memory 存在"
                  else
                      echo "    ❌ reserved-memory 不存在"
                  fi
                  if grep -q "video-engine@1c0e000\|video-engine@01c0e000" "$FINAL_DTS"; then
                      echo "    ✅ video-engine 存在"
                  else
                      echo "    ❌ video-engine 不存在"
                  fi
                  rm -f "$FINAL_DTS"
              fi

          else
              echo "  ❌ 未找到 DTB 文件！"
              echo "  搜索 /boot 下所有 .dtb 文件："
              find /boot -name "*.dtb" 2>/dev/null || echo "  (无)"

              # 创建首次启动修复脚本
              cat > /opt/fix-dtb-firstboot.sh << 'DTB_FIX'
          #!/bin/bash
          DTB=$(find /boot -name "sun8i-h2-plus-orangepi-zero.dtb" 2>/dev/null | head -1)
          [ -z "$DTB" ] && exit 0
          cp "$DTB" "${DTB}.orig"

          if command -v fdtput &>/dev/null; then
              fdtput -t s "$DTB" /reserved-memory "#address-cells" "1"
              fdtput -t s "$DTB" /reserved-memory "#size-cells" "1"
              fdtput -t s "$DTB" /reserved-memory "ranges" ""
              fdtput -t s "$DTB" /reserved-memory/linux,cma "compatible" "shared-dma-pool"
              fdtput -t s "$DTB" /reserved-memory/linux,cma "reusable" ""
              fdtput -t x "$DTB" /reserved-memory/linux,cma "size" "0x6000000"
              fdtput -t s "$DTB" /reserved-memory/linux,cma "linux,cma-default" ""

              VE="/soc/video-engine@1c0e000"
              fdtput -t s "$DTB" "$VE" "compatible" "allwinner,sun8i-h2-plus-video-engine"
              fdtput -t x "$DTB" "$VE" "reg" "0x01c0e000 0x1000"
              fdtput -t x "$DTB" "$VE" "interrupts" "0x00 0x3a 0x04"
              fdtput -t s "$DTB" "$VE" "status" "okay"
          fi
          touch /opt/.dtb-fixed
          DTB_FIX
              chmod +x /opt/fix-dtb-firstboot.sh

              cat > /etc/systemd/system/fix-dtb.service << 'DTB_SVC'
          [Unit]
          Description=Fix DTB for cedar_ve
          Before=cedar-ve-build.service
          ConditionPathExists=!/opt/.dtb-fixed
          [Service]
          Type=oneshot
          ExecStart=/opt/fix-dtb-firstboot.sh
          RemainAfterExit=yes
          [Install]
          WantedBy=multi-user.target
          DTB_SVC
              systemctl enable fix-dtb.service
          fi

          # ----------------------------------------------------------
          # 5. 内核启动参数
          # ----------------------------------------------------------
          echo "[5/7] 调整内核启动参数..."
          ARMBIAN_ENV="/boot/armbianEnv.txt"
          if [ -f "$ARMBIAN_ENV" ]; then
              cp "$ARMBIAN_ENV" "${ARMBIAN_ENV}.orig"
              # 移除已有 cma= 参数
              sed -i 's/\bcma=[0-9]*M\b//g' "$ARMBIAN_ENV"
              # 添加 cma=96M
              if grep -q "^extraargs=" "$ARMBIAN_ENV"; then
                  sed -i 's/^extraargs=/extraargs=cma=96M /' "$ARMBIAN_ENV"
              else
                  echo "extraargs=cma=96M" >> "$ARMBIAN_ENV"
              fi
              sed -i 's/  */ /g' "$ARMBIAN_ENV"
              echo "  => cma=96M 已设置"
          fi

          # ----------------------------------------------------------
          # 6. udev 规则
          # ----------------------------------------------------------
          echo "[6/7] 创建 udev 规则..."
          cat > /etc/udev/rules.d/99-cedar-ve.rules << 'UDEV'
          KERNEL=="cedar_ve", MODE="0666", GROUP="video"
          KERNEL=="cedar_dev", MODE="0666", GROUP="video"
          KERNEL=="ion", MODE="0666", GROUP="video"
          KERNEL=="sunxi-*", MODE="0666", GROUP="video"
          UDEV

          # ----------------------------------------------------------
          # 7. 验证脚本
          # ----------------------------------------------------------
          echo "[7/7] 创建验证脚本..."
          cat > /usr/local/bin/cedar-ve-check << 'CHECK_SCRIPT'
          #!/bin/bash
          PASS=0; FAIL=0; WARN=0
          check() {
              local desc="$1" result="$2"
              if [ "$result" -eq 0 ]; then echo "  ✅ $desc"; ((PASS++))
              elif [ "$result" -eq 2 ]; then echo "  ⚠️  $desc"; ((WARN++))
              else echo "  ❌ $desc"; ((FAIL++)); fi
          }

          echo "============================================================"
          echo " Cedar VE 底层验证 | $(uname -r) | $(date)"
          echo "============================================================"

          echo ""; echo "[模块]"
          lsmod | grep -q "cedar_ve" && check "cedar_ve 已加载" 0 || {
              modprobe cedar_ve 2>/dev/null && check "cedar_ve 可加载" 0 || check "cedar_ve 不可用" 1
          }

          echo ""; echo "[设备节点]"
          [ -e /dev/cedar_ve ] && check "/dev/cedar_ve" 0 || check "/dev/cedar_ve 不存在" 1
          [ -e /dev/ion ] && check "/dev/ion" 0 || check "/dev/ion 不存在" 2

          echo ""; echo "[CMA]"
          CMA=$(grep CmaTotal /proc/meminfo 2>/dev/null | awk '{print $2}')
          [ -n "$CMA" ] && [ "$CMA" -gt 0 ] 2>/dev/null && \
              check "CMA: $((CMA/1024)) MB" 0 || check "CMA 不可用" 1

          echo ""; echo "[设备树]"
          DTB_BASE="/sys/firmware/devicetree/base"
          [ -d "$DTB_BASE/reserved-memory" ] && check "DTB: reserved-memory" 0 || check "DTB: reserved-memory 缺失" 1
          VE_OK=false
          for p in "$DTB_BASE/soc/video-engine@1c0e000" "$DTB_BASE/soc/video-engine@01c0e000"; do
              [ -d "$p" ] && VE_OK=true && break
          done
          $VE_OK && check "DTB: video-engine" 0 || check "DTB: video-engine 缺失" 1

          echo ""; echo "============================================================"
          echo " 结果: ✅$PASS ⚠️$WARN ❌$FAIL"
          echo "============================================================"
          [ $FAIL -gt 0 ] && exit 1 || exit 0
          CHECK_SCRIPT
          chmod +x /usr/local/bin/cedar-ve-check

          # 首次启动验证服务
          cat > /etc/systemd/system/cedar-ve-verify.service << 'VSVC'
          [Unit]
          Description=Cedar VE Verification
          After=cedar-ve-build.service multi-user.target
          ConditionPathExists=!/opt/.cedar-ve-verified
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/cedar-ve-check
          ExecStartPost=/bin/touch /opt/.cedar-ve-verified
          RemainAfterExit=yes
          StandardOutput=journal+console
          [Install]
          WantedBy=multi-user.target
          VSVC
          systemctl enable cedar-ve-verify.service

          # 清理
          rm -rf /tmp/sunxi-cedar-mainline /tmp/opi-zero-modified.dts
          apt-get clean
          rm -rf /var/lib/apt/lists/*

          echo ""
          echo "============================================================"
          echo " Phase 1 完成！"
          echo "============================================================"
          exit 0
          CUSTOMIZE_EOF

          chmod +x armbian-build/userpatches/customize-image.sh
          echo "✅ customize-image.sh 已创建"

      # ============================================================
      # 编译
      # ============================================================
      - name: Compile Armbian Image
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=orangepizero \
            BRANCH=${{ github.event.inputs.branch }} \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            EXPERT=yes \
            IGNORE_UPDATES=yes

      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OPiZero-${{ github.event.inputs.release }}-${{ github.event.inputs.branch }}-cedar-ve
          path: armbian-build/output/images/*.xz
          retention-days: 7

  # ================================================================
  # 测试阶段
  # ================================================================
  boot-test:
    name: DTB Verification + Boot Test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm xz-utils device-tree-compiler

      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./workspace

      - name: Extract Image
        run: |
          cd ./workspace
          xz -d *.xz
          IMAGE_FILE=$(ls *.img | head -n 1)
          echo "IMAGE_FILE=$IMAGE_FILE" >> $GITHUB_ENV

          LOOP_DEV=$(sudo losetup -Pf --show "$IMAGE_FILE")
          echo "LOOP_DEV=$LOOP_DEV" >> $GITHUB_ENV
          sudo mkdir -p /mnt/armbian
          sudo mount "${LOOP_DEV}p1" /mnt/armbian

          mkdir -p ../boot-files
          # 内核
          cp $(ls /mnt/armbian/boot/vmlinuz-* /mnt/armbian/boot/zImage* 2>/dev/null | head -1) ../boot-files/vmlinuz
          # initrd
          cp $(ls /mnt/armbian/boot/uInitrd* /mnt/armbian/boot/initrd.img-* 2>/dev/null | head -1) ../boot-files/initrd
          # DTB
          DTB_SRC=$(find /mnt/armbian/boot/ -name "sun8i-h2-plus-orangepi-zero.dtb" 2>/dev/null | head -1)
          if [ -n "$DTB_SRC" ]; then
              cp "$DTB_SRC" ../boot-files/dtb
          else
              DTB_SRC=$(find /mnt/armbian/boot/ -name "*.dtb" 2>/dev/null | head -1)
              [ -n "$DTB_SRC" ] && cp "$DTB_SRC" ../boot-files/dtb
          fi

          sudo umount /mnt/armbian
          sudo losetup -d "$LOOP_DEV"
          mv "$IMAGE_FILE" ../armbian.img

      # ============================================================
      # DTB 验证（修复后的版本 - 更宽容的检查）
      # ============================================================
      - name: "Verify DTB"
        run: |
          echo "============================================================"
          echo " DTB 验证"
          echo "============================================================"

          DTB_FILE="boot-files/dtb"
          if [ ! -f "$DTB_FILE" ]; then
              echo "❌ DTB 文件不存在"
              echo "boot-files 目录内容："
              ls -la boot-files/ 2>/dev/null || echo "(目录不存在)"
              exit 1
          fi

          echo "DTB 文件: $DTB_FILE ($(stat -c%s "$DTB_FILE") bytes)"
          echo ""

          # 反编译
          dtc -I dtb -O dts -o /tmp/check.dts "$DTB_FILE" 2>/dev/null
          if [ ! -f /tmp/check.dts ]; then
              echo "❌ DTB 反编译失败"
              exit 1
          fi

          PASS=0; FAIL=0; WARN=0

          # 检查 1: reserved-memory
          echo "[1] reserved-memory (CMA)"
          if grep -q "reserved-memory" /tmp/check.dts; then
              echo "  ✅ reserved-memory 节点存在"
              ((PASS++))
              if grep -q "shared-dma-pool\|linux,cma" /tmp/check.dts; then
                  echo "  ✅ CMA 池定义存在"
                  ((PASS++))
              fi
          else
              echo "  ❌ reserved-memory 不存在"
              ((FAIL++))
              echo ""
              echo "  调试：DTB 中所有顶级节点："
              grep -E "^\t[a-z]" /tmp/check.dts | head -20
          fi

          # 检查 2: video-engine
          echo ""
          echo "[2] video-engine 节点"
          if grep -q "video-engine@1c0e000\|video-engine@01c0e000" /tmp/check.dts; then
              echo "  ✅ video-engine 节点存在"
              ((PASS++))
              # 检查 status
              if grep -A 10 "video-engine@1c0e000\|video-engine@01c0e000" /tmp/check.dts | grep -q 'status.*"okay"'; then
                  echo "  ✅ status = okay"
                  ((PASS++))
              else
                  echo "  ⚠️ status 不是 okay"
                  ((WARN++))
              fi
          else
              echo "  ❌ video-engine 不存在"
              ((FAIL++))
              echo ""
              echo "  调试：DTB 中 soc 下的节点："
              grep -E "^\t\t[a-z].*@" /tmp/check.dts | head -30
          fi

          # 检查 3: 主线 cedrus 冲突
          echo ""
          echo "[3] 主线 cedrus 冲突检查"
          if grep -q "video-codec@1c0e000" /tmp/check.dts; then
              if grep -A 10 "video-codec@1c0e000" /tmp/check.dts | grep -q 'status.*"disabled"'; then
                  echo "  ✅ video-codec 已禁用"
                  ((PASS++))
              else
                  echo "  ⚠️ video-codec 未禁用（可能冲突）"
                  ((WARN++))
              fi
          else
              echo "  ℹ️ video-codec 不存在（无冲突）"
              ((PASS++))
          fi

          echo ""
          echo "============================================================"
          echo " 结果: ✅$PASS ⚠️$WARN ❌$FAIL"
          echo "============================================================"

          # 输出 DTB 关键内容供调试
          echo ""
          echo "===== DTB 关键内容 ====="
          grep -B1 -A 10 "reserved-memory\|video-engine\|linux,cma\|video-codec" /tmp/check.dts | head -80
          echo "========================"

          # 如果有失败，输出完整 DTB 供分析
          if [ $FAIL -gt 0 ]; then
              echo ""
              echo "===== 完整 DTB 反编译（前 200 行）====="
              head -200 /tmp/check.dts
              echo "========================================"
              exit 1
          fi

      # ============================================================
      # 镜像内容检查
      # ============================================================
      - name: "Verify Image Contents"
        run: |
          echo "============================================================"
          echo " 镜像内容验证"
          echo "============================================================"

          LOOP_DEV=$(sudo losetup -Pf --show armbian.img)
          sudo mkdir -p /mnt/check
          sudo mount "${LOOP_DEV}p1" /mnt/check

          PASS=0; FAIL=0; WARN=0

          # cedar_ve 驱动
          echo "[1] cedar_ve 驱动"
          KVER=$(ls /mnt/check/lib/modules/ | head -1)
          if find /mnt/check/lib/modules/$KVER -name "cedar_ve.ko*" 2>/dev/null | grep -q .; then
              echo "  ✅ cedar_ve.ko 存在"
              ((PASS++))
          elif [ -f /mnt/check/opt/cedar-ve-driver/build.sh ]; then
              echo "  ⚠️ 未预编译，有首次启动编译脚本"
              ((WARN++))
          else
              echo "  ❌ cedar_ve 不可用"
              ((FAIL++))
          fi

          # 模块加载配置
          echo "[2] 模块自动加载"
          if [ -f /mnt/check/etc/modules-load.d/cedar_ve.conf ] || grep -q "cedar_ve" /mnt/check/etc/modules 2>/dev/null; then
              echo "  ✅ 自动加载已配置"
              ((PASS++))
          else
              echo "  ⚠️ 未配置自动加载"
              ((WARN++))
          fi

          # udev
          echo "[3] udev 规则"
          [ -f /mnt/check/etc/udev/rules.d/99-cedar-ve.rules ] && \
              { echo "  ✅ udev 规则存在"; ((PASS++)); } || \
              { echo "  ⚠️ udev 规则不存在"; ((WARN++)); }

          # 验证脚本
          echo "[4] 验证脚本"
          [ -f /mnt/check/usr/local/bin/cedar-ve-check ] && \
              { echo "  ✅ cedar-ve-check 存在"; ((PASS++)); } || \
              { echo "  ❌ cedar-ve-check 不存在"; ((FAIL++)); }

          # 内核配置
          echo "[5] 内核配置"
          CONFIG=$(find /mnt/check/boot -name "config-*" | head -1)
          if [ -n "$CONFIG" ]; then
              grep -q "CONFIG_CMA=y" "$CONFIG" && \
                  { echo "  ✅ CONFIG_CMA=y"; ((PASS++)); } || \
                  { echo "  ❌ CONFIG_CMA 未启用"; ((FAIL++)); }
          else
              echo "  ⚠️ 未找到内核配置"
              ((WARN++))
          fi

          # armbianEnv.txt
          echo "[6] 启动参数"
          if [ -f /mnt/check/boot/armbianEnv.txt ]; then
              grep -q "cma=" /mnt/check/boot/armbianEnv.txt && \
                  { echo "  ✅ cma= 参数存在"; ((PASS++)); } || \
                  { echo "  ⚠️ 无 cma= 参数"; ((WARN++)); }
          fi

          sudo umount /mnt/check
          sudo losetup -d "$LOOP_DEV"

          echo ""
          echo "============================================================"
          echo " 结果: ✅$PASS ⚠️$WARN ❌$FAIL"
          echo "============================================================"
          [ $FAIL -gt 0 ] && exit 1 || true

      # ============================================================
      # QEMU 启动测试
      # ============================================================
      - name: "QEMU Boot Test"
        run: |
          echo "=> QEMU 启动测试..."
          sudo qemu-system-arm \
            -M orangepi-zero \
            -m 512 \
            -cpu cortex-a7 \
            -nographic \
            -dtb boot-files/dtb \
            -kernel boot-files/vmlinuz \
            -initrd boot-files/initrd \
            -append 'earlyprintk loglevel=8 console=ttyS0 root=/dev/mmcblk0p1 ro rootwait' \
            -drive if=sd,format=raw,file=armbian.img > qemu_serial.log 2>&1 &

          QEMU_PID=$!
          TIMEOUT=180
          BOOT_OK=false

          for i in $(seq 1 $TIMEOUT); do
              if grep -qE "login:|Reached target Multi-User|Armbian" qemu_serial.log 2>/dev/null; then
                  BOOT_OK=true
                  break
              fi
              sleep 1
          done

          sudo kill $QEMU_PID 2>/dev/null; wait $QEMU_PID 2>/dev/null || true

          echo ""
          echo "[CMA 日志]"
          grep -i "cma" qemu_serial.log | head -10 || echo "  (无)"
          echo ""
          echo "[cedar/ve 日志]"
          grep -i "cedar\|video-engine\|ve@" qemu_serial.log | head -10 || echo "  (无)"
          echo ""
          echo "[最后 20 行]"
          tail -20 qemu_serial.log

          if [ "$BOOT_OK" = false ]; then
              echo "❌ 启动超时"
              exit 1
          fi
          echo "✅ 启动成功"

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-logs
          path: qemu_serial.log
          retention-days: 7
          if-no-files-found: ignore
