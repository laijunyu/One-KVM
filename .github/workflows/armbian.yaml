name: Build Armbian Image for OPi Zero

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BOARD: orangepizero
  BRANCH: current
  RELEASE: trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Remove Docker completely
        run: |
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo apt-get purge -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin docker-ce-rootless-extras 2>/dev/null || true
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/docker /var/lib/containerd
          which docker && echo "⚠️ docker still exists!" || echo "✅ Docker fully removed"

      - name: Install QEMU user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build
          fetch-depth: 1

      # ============================================
      # 修复：删除坏补丁 + 清理 series.conf 中的引用
      # ============================================
      - name: Remove broken patches and clean series.conf
        run: |
          cd armbian-build
          # 1. 删除补丁文件
          find patch/kernel -name "*bigtreetech-cb1*" -type f -print -delete
          # 2. 清理 series.conf 中的引用（这才是关键！）
          find patch/kernel -name "series.conf" -exec sed -i '/bigtreetech-cb1/d' {} \;
          # 3. 以防万一，也清理其他可能的 series 文件
          find patch/kernel -name "*.series" -exec sed -i '/bigtreetech-cb1/d' {} \;
          echo "✅ Patches removed and series.conf cleaned"

      - name: Build Armbian image
        run: |
          cd armbian-build
          ./compile.sh build \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ env.RELEASE }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="" \
            NO_HOST_RELEASE_CHECK=yes \
            EXPERT=yes \
            2>&1 | tee build.log

      - name: Find output image
        id: find_img
        run: |
          IMG=$(find armbian-build/output/images -name "*.img" -type f | head -1)
          if [ -z "$IMG" ]; then
            echo "❌ No .img found"
            find armbian-build/output -type f | head -20
            exit 1
          fi
          echo "img_path=$IMG" >> $GITHUB_OUTPUT
          echo "img_name=$(basename $IMG)" >> $GITHUB_OUTPUT
          echo "✅ Image: $IMG"
          ls -lh "$IMG"

      - name: Compress image
        run: |
          xz -T0 -k "${{ steps.find_img.outputs.img_path }}"
          ls -lh "${{ steps.find_img.outputs.img_path }}.xz"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_img.outputs.img_name }}.xz
          path: ${{ steps.find_img.outputs.img_path }}.xz
          retention-days: 14
