name: Build Armbian Image for OPi Zero

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BOARD: orangepizero
  BRANCH: current
  RELEASE: trixie

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Disable Docker (force native build)
        run: |
          sudo systemctl stop docker docker.socket containerd 2>/dev/null || true
          sudo systemctl disable docker docker.socket containerd 2>/dev/null || true
          docker info 2>&1 && echo "⚠️ Docker still running!" || echo "✅ Docker disabled"

      - name: Install QEMU user-static
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -i qemu || true

      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          path: armbian-build
          fetch-depth: 1

      - name: Build Armbian image
        run: |
          cd armbian-build
          ./compile.sh build \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ env.RELEASE }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="" \
            NO_HOST_RELEASE_CHECK=yes \
            EXPERT=yes \
            2>&1 | tee build.log

      - name: Find output image
        id: find_img
        run: |
          IMG=$(find armbian-build/output/images -name "*.img" -type f | head -1)
          if [ -z "$IMG" ]; then
            echo "❌ No .img found"
            find armbian-build/output -type f | head -20
            exit 1
          fi
          echo "img_path=$IMG" >> $GITHUB_OUTPUT
          echo "img_name=$(basename $IMG)" >> $GITHUB_OUTPUT
          echo "✅ Image: $IMG"
          ls -lh "$IMG"

      - name: Compress image
        run: |
          xz -T0 -k "${{ steps.find_img.outputs.img_path }}"
          ls -lh "${{ steps.find_img.outputs.img_path }}.xz"

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_img.outputs.img_name }}.xz
          path: ${{ steps.find_img.outputs.img_path }}.xz
          retention-days: 14
