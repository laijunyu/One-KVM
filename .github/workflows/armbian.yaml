name: Build and Boot-Test Armbian Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: '选择 Debian 发行版'
        required: true
        default: 'bookworm'
        type: choice
        options:
          - bookworm
      branch:
        description: '选择内核分支'
        required: true
        default: 'current'
        type: choice
        options:
          - current

jobs:
  # ==================== 阶段 1：编译镜像 ====================
  build:
    name: Build Image
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-${{ github.event.inputs.branch }}-StaticIP
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Install QEMU and Binfmt on Host
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Disable Docker to Force Native Build
        run: |
          sudo systemctl stop docker.service docker.socket || true
          sudo systemctl disable docker.service docker.socket || true
          sudo apt-get remove -y docker-ce docker-ce-cli containerd.io || true
          sudo apt-get autoremove -y

      - name: Clone Armbian Build Framework
        run: git clone --depth=1 https://github.com/armbian/build armbian-build

      # ========== 修改点 1：添加内核配置补丁，启用 cedrus VPU 驱动 ==========
      - name: Enable Cedrus VPU Driver in Kernel Config
        run: |
          mkdir -p armbian-build/userpatches/kernel/sunxi-current
          cat << 'EOF' > armbian-build/userpatches/kernel/sunxi-current/cedrus-enable.cfg
          CONFIG_VIDEO_SUNXI_CEDRUS=m
          CONFIG_MEDIA_CONTROLLER=y
          CONFIG_V4L2_MEM2MEM_DEV=y
          EOF

      - name: Inject Static IP Configuration
        run: |
          mkdir -p armbian-build/userpatches
          cat << 'EOF' > armbian-build/userpatches/customize-image.sh
          #!/bin/bash
          echo "=> Configuring static IP (192.168.114.2/24) via NetworkManager..."
          mkdir -p /etc/NetworkManager/system-connections
          cat << 'NM_EOF' > /etc/NetworkManager/system-connections/Wired-Static.nmconnection
          [connection]
          id=Wired-Static
          type=ethernet
          autoconnect=true
          [ipv4]
          method=manual
          address1=192.168.114.2/24,192.168.114.1
          dns=8.8.8.8;114.114.114.114;
          [ipv6]
          method=auto
          NM_EOF
          chmod 600 /etc/NetworkManager/system-connections/Wired-Static.nmconnection
          EOF
          chmod +x armbian-build/userpatches/customize-image.sh

      - name: Compile Armbian Image
        run: |
          cd armbian-build
          ./compile.sh \
            BOARD=orangepizero \
            BRANCH=${{ github.event.inputs.branch }} \
            RELEASE=${{ github.event.inputs.release }} \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,xz \
            EXPERT=yes \
            IGNORE_UPDATES=yes

      - name: Upload Output Image
        uses: actions/upload-artifact@v4
        with:
          name: Armbian-OrangePiZero-${{ github.event.inputs.release }}-${{ github.event.inputs.branch }}-StaticIP
          path: armbian-build/output/images/*.xz
          retention-days: 7

  # ==================== 阶段 2：QEMU 启动测试 ====================
  boot-test:
    name: QEMU Boot Test
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Install QEMU & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm xz-utils

      - name: Download Artifact Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ./workspace

      - name: Extract Boot Files from Image
        run: |
          cd ./workspace
          echo "=> Uncompressing Image..."
          xz -d *.xz
          IMAGE_FILE=$(ls *.img | head -n 1)
          
          echo "=> Mounting image via loop device..."
          LOOP_DEV=$(sudo losetup -Pf --show "$IMAGE_FILE")
          
          sudo mkdir -p /mnt/armbian
          sudo mount "${LOOP_DEV}p1" /mnt/armbian
          
          echo "=> Copying kernel and DTB for QEMU emulation..."
          mkdir -p ../boot-files
          
          # 精准提取单一内核文件
          KERNEL_SRC=$(ls /mnt/armbian/boot/vmlinuz-* /mnt/armbian/boot/zImage* 2>/dev/null | head -n 1)
          cp "$KERNEL_SRC" ../boot-files/vmlinuz
          
          # 精准提取单一 Initrd 文件
          INITRD_SRC=$(ls /mnt/armbian/boot/uInitrd* /mnt/armbian/boot/initrd.img-* 2>/dev/null | head -n 1)
          cp "$INITRD_SRC" ../boot-files/initrd
          
          # ========== 修改点 2：提取正确的设备树（H2+ Orange Pi Zero） ==========
          DTB_SRC=$(find /mnt/armbian/boot/ -name "sun8i-h2-plus-orangepi-zero.dtb" | head -n 1)
          cp "$DTB_SRC" ../boot-files/dtb
          
          echo "=> Cleaning up mounts..."
          sudo umount /mnt/armbian
          sudo losetup -d "$LOOP_DEV"
          mv "$IMAGE_FILE" ../armbian.img

      - name: Run QEMU Boot Assertion
        run: |
          echo "=> Starting QEMU emulation in background..."
          # ========== 修改点 3：调整机器类型为 orangepi-zero ==========
          # 注意：QEMU 可能不完全支持 orangepi-zero，若失败可回退为 orangepi-pc
          sudo qemu-system-arm \
            -M orangepi-zero \
            -m 1024 \
            -cpu cortex-a7 \
            -nographic \
            -dtb boot-files/dtb \
            -kernel boot-files/vmlinuz \
            -initrd boot-files/initrd \
            -append 'earlyprintk loglevel=8 console=ttyS0 root=/dev/mmcblk0p1 ro rootwait' \
            -drive if=sd,format=raw,file=armbian.img > qemu_serial.log 2>&1 &
          
          QEMU_PID=$!
          
          TIMEOUT=180
          BOOT_SUCCESS=false
          echo "=> Waiting for system to hit login prompt (Timeout: ${TIMEOUT}s)..."
          
          for i in $(seq 1 $TIMEOUT); do
            if grep -E "login:|Reached target Multi-User System|Armbian" qemu_serial.log > /dev/null; then
              echo "✅ [SUCCESS] 镜像成功启动并进入了系统控制台！"
              BOOT_SUCCESS=true
              break
            fi
            sleep 1
          done
          
          sudo kill $QEMU_PID || true
          
          echo "=================== QEMU 串口完整日志 ==================="
          cat qemu_serial.log
          echo "========================================================"
          
          if [ "$BOOT_SUCCESS" = false ]; then
            echo "❌ [FAILURE] 镜像未能成功引导，或在 180 秒内未到达登录界面。"
            exit 1
          fi
